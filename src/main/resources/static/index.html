<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rezerwacja sal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div class="header-row">
        <h1>Rezerwacja sal spotkań</h1>
        <div id="user-bar" class="user-bar" hidden>
            <span id="user-label"></span>
            <button type="button" id="logout">Wyloguj</button>
        </div>
    </div>
</header>

<section id="login-panel" class="column login-panel">
    <h2>Logowanie</h2>
    <form id="login-form" novalidate>
        <label>E-mail
            <input name="email" type="email" autocomplete="username">
        </label>
        <label>Hasło
            <input name="password" type="password" autocomplete="current-password">
        </label>
        <button type="submit">Zaloguj</button>
    </form>
    <div id="login-message" class="message" role="status"></div>
</section>

<div id="app" hidden>
    <div class="toolbar">
        <label for="date">Dzień</label>
        <input type="date" id="date" value="2027-03-15">
    </div>
    <div id="rooms" class="rooms" aria-label="Sale"></div>
    <div id="rooms-message" class="message" role="status"></div>

    <main>
        <section class="column">
            <h2 id="availability-title">Dostępność</h2>
            <p id="availability-hint" class="hint">Wybierz salę, aby zobaczyć dostępność.</p>
            <div id="availability" class="grid"></div>

            <h2>Nowa rezerwacja</h2>
            <form id="booking-form" novalidate>
                <label>Liczba osób
                    <input name="attendees" type="number" min="1" value="1">
                </label>
                <label>Od
                    <input name="startTime" type="time" step="1800" value="10:00">
                </label>
                <label>Do
                    <input name="endTime" type="time" step="1800" value="12:00">
                </label>
                <button type="submit">Rezerwuj</button>
            </form>
            <dl id="quote" class="quote"></dl>
            <div id="form-message" class="message" role="status"></div>
        </section>

        <aside class="column">
            <h2 id="bookings-title">Moje rezerwacje</h2>
            <div id="bookings-message" class="message" role="status"></div>
            <ul id="bookings" class="bookings"></ul>
        </aside>
    </main>

    <section id="admin-panel" class="column admin-panel" hidden>
        <h2>Panel administratora</h2>
        <div id="admin-message" class="message" role="status"></div>
        <div class="admin-lists">
            <div>
                <h3>Oczekujące prośby</h3>
                <ul id="admin-pending" class="bookings"></ul>
            </div>
            <div>
                <h3 id="admin-day-title">Rezerwacje dnia (wszyscy użytkownicy)</h3>
                <ul id="admin-day" class="bookings"></ul>
            </div>
        </div>
    </section>
</div>

<script src="app.js"></script>
</body>
</html>
